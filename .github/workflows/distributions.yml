name: Сборка AI Limits Monitor

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
          - runner: xcode-27
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Сборка и проверка Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw 'Неверная контрольная сумма Inno Setup' }
          $params = @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/NOICONS', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $compiler + '"'))
          $process = Start-Process -FilePath $setup -ArgumentList $params -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw "Inno Setup завершился с кодом $($process.ExitCode)" }
          $venv = Join-Path $env:RUNNER_TEMP 'monitor-python'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --only-binary=:all: -r requirements-build.txt
          ./packaging/build-installer.ps1 -Python $python -Compiler (Join-Path $compiler 'ISCC.exe')
          $artifact = Get-ChildItem -LiteralPath release -Filter '*-windows-x64-setup.exe'
          & $python packaging/check_distribution.py $artifact.FullName
      - name: Сборка и проверка macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/monitor-python"
          python="$RUNNER_TEMP/monitor-python/bin/python"
          "$python" -m pip install --only-binary=:all: -r requirements-build.txt
          "$python" packaging/build.py
          "$python" packaging/check_distribution.py release/*-macos-"$(uname -m)".zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Limits-Monitor-${{ matrix.target }}
          path: release/*-${{ matrix.target }}*
          compression-level: 0
          if-no-files-found: error
